<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // Redirect all paths to index.html so React Router can handle them.
      // GitHub Pages serves this file for any 404.
      var repo = '/trueshot';
      location.replace(repo + '/?p=' + encodeURIComponent(location.pathname + location.search + location.hash));
    </script>
  </head>
  <body></body>
</html>
